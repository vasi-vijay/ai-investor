# Defaults are safe: MOCK data, PAPER mode, live disabled, no credentials required.
# Secrets are NEVER put here — supply them via environment variables (see .env.example).
spring:
  application:
    name: ai-investor
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aiinvestor?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:aiinvestor}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false

logging:
  level:
    com.aiinvestor: INFO

app:
  data:
    source: ${DATA_SOURCE:MOCK}          # MOCK | GROWW
    timeframe-minutes: 5
  mock:
    replay-enabled: ${MOCK_REPLAY:true}  # step through simulated days so the pipeline runs outside market hours
    replay-step-seconds: 3
  paper:
    initial-capital: ${PAPER_CAPITAL:1000000}
  ai:
    enabled: true
    provider: ${AI_PROVIDER:MOCK_HEURISTIC}   # CLAUDE requires ANTHROPIC_API_KEY (environment only)
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
  groww:
    enabled: ${GROWW_ENABLED:false}
    access-token: ${GROWW_ACCESS_TOKEN:}
    access-token-file: ${GROWW_ACCESS_TOKEN_FILE:}
    api-key: ${GROWW_API_KEY:}
    api-secret: ${GROWW_API_SECRET:}
    totp-secret: ${GROWW_TOTP_SECRET:}
  live:
    enabled: false                      # live order placement is OFF; see docs/LIVE_TRADING.md
    compliance-confirmed: false
  security:
    admin-user: ${APP_ADMIN_USER:admin}
    admin-password-bcrypt: ${APP_ADMIN_PASSWORD_BCRYPT:}
    admin-password: ${APP_ADMIN_PASSWORD:}
    viewer-user: ${APP_VIEWER_USER:}
    viewer-password-bcrypt: ${APP_VIEWER_PASSWORD_BCRYPT:}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    poll-seconds: 20

spring.task.scheduling:
  shutdown:
    await-termination: true
    await-termination-period: 30s

server.servlet.session:
  timeout: 30m
  cookie:
    http-only: true
    same-site: strict
    secure: ${COOKIE_SECURE:false}   # set true behind HTTPS
